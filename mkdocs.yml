site_name: Pannagram
site_description: Unbiased pangenome alignment, Structural Variants and Mobilome calling
site_url: https://iganna.github.io/pannagram/
repo_url: https://github.com/iganna/pannagram
repo_name: iganna/pannagram
copyright: Anna A. Igolkina et al.

docs_dir: docs
site_dir: site
# Keep flat *.html URLs so the raw <img src="images/..."> tags in the pages
# resolve correctly (MkDocs does not rewrite paths inside raw HTML).
use_directory_urls: false

theme:
  name: material
  logo: images/pannagram_logo.png
  favicon: images/pannagram_logo.png
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

# Draft / superseded pages kept on disk (point 3) but intentionally not linked.
not_in_nav: |
  /alignment_data_homo.md
  /features_genes.md
  /library.md
  /README_SVs.md

nav:
  - Getting Started:
      - Overview: index.md
      - Installation: home_install.md
      - Quick Start / Tutorial: home_quick_start.md
      - Input Data: home_input_data.md
      - Output Data: home_output_data.md
  - Pangenome Alignment:
      - Overview: alignment.md
      - Build Alignments: alignment_modes.md
      - Extra parameters: alignment_options.md
  - Feature Calling:
      - Overview: features.md
      - Alignment Summary: features_summary.md
      - SNPs & Diversity: features_snp.md
      - Structural Variants & Mobilome (MEF): features_sv.md
  - Modules:
      - Simsearch: simsearch.md
      - Chromotools: chromotools.md
  - R library — Sequences:
      - Handy Functions: library_functions.md
      - Dotplots: library_dotplot.md
      - ORF-Finder: library_orffinder.md
      - Sequence Alignment Plots: library_msaplot.md
  - R library — Pangenome:
      - Pangenome Plots: library_panplot.md
      - Coordinate Conversion & Liftover: library_liftover.md
      - Extracting Specific Regions: library_cutaln.md
  - R library — Mobilome:
      - Mobile Element Families (MEF): library_family.md
  - Reference:
      - Common options: home_options.md
      - Workshop: workshop.md
